# Build the MkDocs site from docs/ and deploy it to GitHub Pages, with the
# signed apt repository folded in under /apt/ (assembled by
# packaging/scripts/build-apt-repo.sh from the .debs of recent GitHub
# Releases). release.yml dispatches this workflow after each release so the
# new packages land in the pool.
# Requires repo Settings -> Pages -> Source set to "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "packaging/scripts/build-apt-repo.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  # Weekly rebuild. The apt Release file carries a 30-day Valid-Until
  # (packaging/scripts/build-apt-repo.sh), so a month with no docs push and
  # no release would otherwise expire the repo and fail every `apt update`.
  schedule:
    - cron: "17 6 * * 1"

# Read-only token by default. Only the deploy job gets the Pages and OIDC
# grants: the build job runs mkdocs and the apt assembly over third-party
# code and must not be able to publish on its own.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Build site
        run: uvx --with mkdocs-material mkdocs build --strict --site-dir _site

      # Fold the signed apt repo into the site under /apt/. Stateless: the
      # pool is rebuilt from the .debs of the newest $APT_POOL_RELEASES
      # GitHub releases on every deploy, so the live repo always mirrors the
      # releases (deleting a release drops it; older versions age out, which
      # also keeps the site far below the Pages 1 GB cap).
      # A Pages deploy replaces the entire site, so on the canonical repo a
      # missing signing key fails the build rather than silently publishing a
      # site without /apt/ (that would 404 every apt client on the next
      # `apt update`). Forks without the secret skip the step instead.
      - name: Assemble apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          APT_POOL_RELEASES: "5"
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            if [ "$GITHUB_REPOSITORY" = "curtisgalloway/paniolo" ]; then
              echo "::error::APT_SIGNING_KEY secret is not set — refusing to deploy a site without /apt/."
              exit 1
            fi
            echo "::warning::APT_SIGNING_KEY not set (fork?) — skipping apt repo assembly."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils
          mkdir -p /tmp/apt-debs
          gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases \
            --limit "$APT_POOL_RELEASES" --json tagName --jq '.[].tagName' \
          | while read -r tag; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern '*.deb' --dir /tmp/apt-debs \
                || echo "::warning::no .deb assets on $tag — skipped"
            done
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --batch --list-secret-keys --with-colons \
                | awk -F: '/^fpr:/ {print $10; exit}')
          packaging/scripts/build-apt-repo.sh /tmp/apt-debs _site/apt "$fpr"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
