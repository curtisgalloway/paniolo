# CodeQL code scanning. This replaces GitHub's "default setup", which must be
# disabled in Settings -> Code security -> Code scanning before this workflow's
# results will be accepted (the two configurations cannot both be active).
#
# Why this repo owns the workflow:
#
#   1. The language list is explicit. Swift is detected here
#      (ocr/visionocr.swift) but is deliberately not analyzed: it is a single
#      macOS-only wrapper over Apple's Vision framework, with no Package.swift
#      or Xcode project for the Swift extractor to build, and it would need a
#      macOS runner. Naming languages here records that decision instead of
#      letting it resurface as a "detected but unconfigured" prompt.
#
#   2. There is somewhere to put extractor options. Default setup exposes only
#      languages, query suite, threat model and runner type.
#
# Known upstream, worked around below: the Rust extractor's macro expansion
# fails for format!, vec!, assert_eq! and friends -- github/codeql#19982, still
# open. The cause is the std version rather than anything in this repo. CodeQL
# 2.26.x cannot parse std newer than 1.94, the runners ship 1.97+, and the
# extractor never resolves a sysroot on its own (the config dump reads
# "sysroot: None, sysroot_src: None"). Left alone that reported 68 of 69 files
# as "extracted with errors", which made the Rust queries near-useless.
#
# The fix is the sysroot step below. Two things learned the expensive way:
# installing rust-src for the *ambient* toolchain does nothing (measured here
# at 1577 macro failures with and without it, identical), and _SYSROOT_SRC on
# its own is not enough -- rust-analyzer then keeps the discovered 1.97 binary
# sysroot. Drop the pin once #19982 closes and newer std parses cleanly.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, matching the cadence default setup used.
    - cron: "24 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # See the header note. Both variables are required. The path is computed
      # rather than hardcoded, and the directory is asserted, so a rustup layout
      # change or a missing rust-src fails loudly here instead of silently
      # reverting to the broken ambient sysroot.
      - name: Pin a 1.94 sysroot for the CodeQL Rust extractor
        if: matrix.language == 'rust'
        run: |
          rustup toolchain install 1.94 --component rust-src --profile minimal --no-self-update
          sysroot="$(rustup run 1.94 rustc --print sysroot)"
          test -d "$sysroot/lib/rustlib/src/rust/library"
          echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT=$sysroot" >> "$GITHUB_ENV"
          echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT_SRC=$sysroot/lib/rustlib/src/rust/library" >> "$GITHUB_ENV"

      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:${{ matrix.language }}"
