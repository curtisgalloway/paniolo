# CodeQL code scanning. This replaces GitHub's "default setup", which must be
# disabled in Settings -> Code security -> Code scanning before this workflow's
# results will be accepted (the two configurations cannot both be active).
#
# Why this repo owns the workflow:
#
#   1. The language list is explicit. Swift is detected here
#      (ocr/visionocr.swift) but is deliberately not analyzed: it is a single
#      macOS-only wrapper over Apple's Vision framework, with no Package.swift
#      or Xcode project for the Swift extractor to build, and it would need a
#      macOS runner. Naming languages here records that decision instead of
#      letting it resurface as a "detected but unconfigured" prompt.
#
#   2. There is somewhere to put extractor options. Default setup exposes only
#      languages, query suite, threat model and runner type.
#
# Known upstream, not ours: the Rust extractor reports ~68 of 69 files as
# "extracted with errors" because macro expansion fails for format!, vec!,
# assert_eq!, anyhow! and even the built-in cfg!. That is github/codeql#19982
# (open), reproducible on unrelated repositories. Installing the rust-src
# component was tried and does NOT help -- 1577 macro expansion failures both
# with and without it, identical -- so this workflow deliberately does not
# install it. Check that issue before re-diagnosing this locally.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, matching the cadence default setup used.
    - cron: "24 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
