name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    # Project rule: every crate in the repo has a CI job, and
    # scripts/ci-local.sh mirrors the Linux ones. This job fails the build
    # when a new crate lands without either, so coverage gaps surface at the
    # PR that creates them instead of months later.
    name: ci coverage (every crate has a job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every crate has a CI job
        run: bash scripts/ci-coverage-check.sh

  actions-pinned:
    # Supply-chain rule: every third-party action is pinned to a full commit
    # SHA, never a movable tag (Review M7). .github/dependabot.yml keeps the
    # pins current; this job fails the build if a `uses:` lands unpinned.
    name: actions pinned (every uses is a commit SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every action reference is a commit SHA
        run: bash scripts/ci-actions-pinned.sh

  shellcheck:
    # Every tracked shell script, at shellcheck's default (info) severity. A
    # finding that is intended carries a `# shellcheck disable=` directive
    # with its reason on the comment line above.
    name: shellcheck (every tracked *.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck

  zigplug:
    # The Python power helper: a locked install, Google-style formatting at
    # 88 columns (pyink, configured in pyproject.toml), a byte-compile of the
    # package, and pytest once zigplug/tests exists.
    name: zigplug (pyink, compileall, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zigplug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync from the lockfile
        run: uv sync --frozen
      - name: Format check
        run: uv run pyink --check --diff .
      - name: Byte-compile
        run: uv run python -m compileall -q src
      - name: Test
        run: |
          if [ -d tests ]; then
            uv run pytest -q tests
          else
            echo "zigplug/tests does not exist yet; nothing to run."
          fi

  evals-check:
    # evals/scenarios/*.toml assert the CLI surface; run.py --check re-walks
    # the live `paniolo --help` tree and fails when a scenario references a
    # command or flag that no longer exists. It needs a real binary, so this
    # job builds cli (debug, cached) rather than trusting a stale dump.
    name: evals check (scenario references vs live CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build paniolo
        run: cargo build --manifest-path cli/Cargo.toml
      - name: Drift check
        run: PATH="$PWD/cli/target/debug:$PATH" python3 evals/run.py --check

  serialcap:
    name: serialcap (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serialcap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: serialcap
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  cli:
    name: cli (fmt, clippy, test)
