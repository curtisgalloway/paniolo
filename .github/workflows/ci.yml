name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    # Project rule: every crate in the repo has a CI job, and
    # scripts/ci-local.sh mirrors the Linux ones. This job fails the build
    # when a new crate lands without either, so coverage gaps surface at the
    # PR that creates them instead of months later.
    name: ci coverage (every crate has a job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check every crate has a CI job
        run: bash scripts/ci-coverage-check.sh

  serialcap:
    name: serialcap (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serialcap
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: serialcap
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  cli:
    name: cli (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@stable
